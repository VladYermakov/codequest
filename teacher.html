<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прогрес учнів — CodeQuest</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17221e;background:#f5f6f1;--green:#236b4d;--line:#e5e9e2;--muted:#6f7c73;--orange:#a45a36}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:24px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.brand{font-weight:800;font-size:20px}.brand em{color:var(--green);font-style:normal}.nav{display:flex;gap:16px;align-items:center}.nav a{color:var(--green);font-size:13px;font-weight:700}.panel,.student{background:white;border:1px solid var(--line);border-radius:14px;padding:21px;margin-bottom:15px}.login{max-width:390px;margin:10vh auto}.login h1,h1{margin:0 0 9px}.login p,.muted{color:var(--muted);line-height:1.5}.login input,select{border:1px solid #dce2da;border-radius:8px;padding:10px;font:inherit;background:white}.login input{display:block;width:100%;margin:12px 0}.button{border:0;border-radius:8px;background:var(--green);color:white;padding:10px 15px;font:700 14px system-ui;cursor:pointer}.button:disabled{opacity:.6}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.toolbar select{min-width:110px}.error{color:#a33d36;min-height:22px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:#f4f7f2;border-radius:10px;padding:11px 14px;min-width:130px}.stat strong{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.student{padding:17px 19px}.student-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.student-name{font-size:16px;font-weight:800}.student-meta{font-size:12px;color:var(--muted);margin-top:3px}.student-score{font-weight:800;color:var(--green);white-space:nowrap}.bar{height:7px;background:#eef1ec;border-radius:9px;margin:13px 0 12px;overflow:hidden}.bar span{display:block;height:100%;background:#89bd62;border-radius:9px}.task-list{display:grid;grid-template-columns:repeat(10,minmax(35px,1fr));gap:7px}.task-chip{text-align:center;padding:7px 3px;border-radius:7px;background:#f4f5f2;color:#89928b;font:700 11px ui-monospace,monospace}.task-chip.done{background:#eaf4e8;color:var(--green)}.empty{padding:28px;text-align:center;color:var(--muted)}#app[hidden],#login[hidden]{display:none}.hint{font-size:12px;color:var(--muted);margin:3px 0 0}@media(max-width:650px){.shell{padding:18px 12px 42px}.panel,.student{padding:16px}.top{align-items:flex-start;flex-direction:column}.task-list{grid-template-columns:repeat(5,1fr)}.student-head{align-items:flex-start}.nav{flex-wrap:wrap}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">&lt;/&gt; code<em>quest</em> · прогрес учнів</div><nav class="nav"><a href="/teacher/submissions">Збережені рішення</a><a href="/">До сайту</a><button class="button" id="logout" hidden>Вийти</button></nav></header>
<section id="login" class="panel login"><h1>Вхід учителя</h1><p>Перегляд прогресу учнів за класами та виконаними завданнями.</p><form id="loginForm"><input id="username" autocomplete="username" placeholder="Логін учителя" required><input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required><button class="button">Увійти</button></form><div class="error" id="loginError" role="alert"></div></section>
<section id="app" hidden><div class="panel"><h1>Прогрес учнів</h1><p class="muted">Для кожного учня видно, які задачі виконано та скільки залишилося.</p><div class="toolbar"><label for="classSelect">Клас</label><select id="classSelect"><option>8В</option><option>9А</option><option>9Г</option><option>10Д</option></select><button class="button" id="refresh">Оновити</button></div><div class="summary" id="summary"></div><div class="error" id="pageError" role="alert"></div></div><div id="students"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function request(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Не вдалося виконати запит.');return data}
function showError(id,message){$(id).textContent=message||''}
function showApp(){ $('login').hidden=true; $('app').hidden=false; $('logout').hidden=false; loadProgress() }
function showLogin(){ $('login').hidden=false; $('app').hidden=true; $('logout').hidden=true }
async function checkSession(){try{await request('/api/teacher/progress?class_name='+encodeURIComponent($('classSelect').value));showApp()}catch{showLogin()}}
function render(data){const students=data.students||[];const totalDone=students.reduce((sum,s)=>sum+s.completed_count,0);$('summary').innerHTML=`<div class="stat"><strong>${students.length}</strong><span>учнів із прогресом</span></div><div class="stat"><strong>${totalDone}</strong><span>виконаних задач</span></div><div class="stat"><strong>${students.reduce((sum,s)=>sum+s.score,0)}</strong><span>балів у класі</span></div>`;const root=$('students');root.replaceChildren();if(!students.length){const empty=document.createElement('div');empty.className='panel empty';empty.textContent=data.class_name==='10Д'?'Учні з’являться тут після входу в SQL-тренажер.':'Учні з’являться після першого збереженого прогресу або запуску коду.';root.append(empty);return}for(const student of students){const card=document.createElement('article');card.className='student';const head=document.createElement('div');head.className='student-head';const identity=document.createElement('div');const name=document.createElement('div');name.className='student-name';name.textContent=student.username;const meta=document.createElement('div');meta.className='student-meta';meta.textContent=`Виконано ${student.completed_count} із ${data.total_tasks} задач`;identity.append(name,meta);const score=document.createElement('div');score.className='student-score';score.textContent=`${student.score} балів`;head.append(identity,score);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('span');fill.style.width=`${Math.round(student.completed_count/data.total_tasks*100)}%`;bar.append(fill);const tasks=document.createElement('div');tasks.className='task-list';for(let i=0;i<data.total_tasks;i++){const chip=document.createElement('div');const done=student.completed_ids.includes(i);chip.className='task-chip'+(done?' done':'');chip.textContent=`${done?'✓':'○'} ${String(i+1).padStart(2,'0')}`;chip.title=`Задача ${i+1}: ${done?'виконана':'ще не виконана'}`;tasks.append(chip)}card.append(head,bar,tasks);root.append(card)}}
async function loadProgress(){showError('pageError','');try{render(await request('/api/teacher/progress?class_name='+encodeURIComponent($('classSelect').value)))}catch(e){showError('pageError',e.message);if(e.message.includes('вхід'))showLogin()}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();showError('loginError','');try{await request('/api/teacher/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});$('password').value='';showApp()}catch(e){showError('loginError',e.message)}});
$('refresh').onclick=loadProgress;$('classSelect').onchange=loadProgress;$('logout').onclick=async()=>{await request('/api/teacher/logout',{method:'POST'});showLogin()};checkSession();
</script></body></html>
