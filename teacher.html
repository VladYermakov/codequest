<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Адмінка вчителя — CodeQuest</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17221e;background:#f5f6f1;--green:#236b4d;--line:#e5e9e2;--muted:#6f7c73}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:26px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-weight:800;font-size:20px}.brand em{color:var(--green);font-style:normal}.top a{color:var(--green);font-size:14px}.panel,.submission{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}.login{max-width:390px;margin:10vh auto}.login h1,h1{margin-top:0}.login p,.muted{color:var(--muted);line-height:1.5}.login input,select,.grade{border:1px solid #dce2da;border-radius:8px;padding:10px;font:inherit;background:#fff}.login input{display:block;width:100%;margin:12px 0}.button{border:0;border-radius:8px;background:var(--green);color:white;padding:10px 15px;font:700 14px inherit;cursor:pointer}.button:disabled{opacity:.6}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar select{min-width:120px}.error{color:#a33d36;min-height:22px}.grid{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}.meta{color:var(--muted);font-size:13px}.code,.output{background:#17221e;color:#dbe7dd;border-radius:9px;padding:14px;white-space:pre-wrap;overflow:auto;font:13px/1.5 ui-monospace,SFMono-Regular,monospace;max-height:420px}.output{background:#f3f5f1;color:#38483e;max-height:150px}.gradebox{min-width:140px;display:flex;flex-direction:column;gap:9px}.grade{width:100%}.badge{font-size:12px;font-weight:700}.badge.ok{color:#236b4d}.badge.bad{color:#a45a36}.empty{padding:28px;text-align:center;color:var(--muted)}#app[hidden],#login[hidden]{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.gradebox{max-width:100%;display:grid;grid-template-columns:1fr auto auto;align-items:center}.shell{padding:18px 13px 44px}.panel,.submission{padding:17px}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">&lt;/&gt; code<em>quest</em> · учитель</div><a href="/">До завдань</a></header>
<section id="login" class="panel login"><h1>Вхід учителя</h1><p>Окрема захищена сторінка для перегляду коду учнів та виставлення оцінок.</p><form id="loginForm"><input id="username" autocomplete="username" placeholder="Логін учителя" required><input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required><button class="button">Увійти</button></form><div class="error" id="loginError" role="alert"></div></section>
<section id="app" hidden><div class="panel"><h1>Роботи учнів</h1><p class="muted">Тут показано останній запущений код для кожного учня й завдання. Оцінки видно лише в цій адмінці.</p><div class="toolbar"><label for="classSelect">Клас</label><select id="classSelect"><option>8В</option><option>9А</option><option>9Г</option></select><button class="button" id="refresh">Оновити</button><button class="button" id="logout" style="background:#59665e">Вийти</button></div><div class="error" id="pageError" role="alert"></div></div><div id="submissions"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function showError(id,message){$(id).textContent=message||''}
async function request(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Не вдалося виконати запит.');return data}
function showApp(){ $('login').hidden=true; $('app').hidden=false; loadSubmissions() }
function showLogin(){ $('login').hidden=false; $('app').hidden=true }
async function checkSession(){try{await request('/api/teacher/submissions?class_name='+encodeURIComponent($('classSelect').value));showApp()}catch{showLogin()}}
function render(records){const root=$('submissions');root.replaceChildren();if(!records.length){const empty=document.createElement('div');empty.className='panel empty';empty.textContent='Для цього класу поки немає запущених робіт.';root.append(empty);return}for(const row of records){const card=document.createElement('article');card.className='submission';const header=document.createElement('div');header.className='grid';const details=document.createElement('div');const title=document.createElement('h2');title.textContent=`${row.username} · завдання ${String(row.challenge_id+1).padStart(2,'0')}`;const meta=document.createElement('p');meta.className='meta';meta.textContent=`Останній запуск: ${new Date(row.updated_at+'Z').toLocaleString('uk-UA')}`;const result=document.createElement('span');result.className='badge '+(row.is_correct?'ok':'bad');result.textContent=row.is_correct?'Відповідь зарахована':'Відповідь не збігається';details.append(title,meta,result);const gradeBox=document.createElement('div');gradeBox.className='gradebox';const label=document.createElement('label');label.textContent='Оцінка (1–12)';const input=document.createElement('input');input.className='grade';input.type='number';input.min='1';input.max='12';input.placeholder='—';input.value=row.grade??'';input.setAttribute('aria-label',`Оцінка для ${row.username}, завдання ${row.challenge_id+1}`);const save=document.createElement('button');save.className='button';save.textContent='Зберегти';save.onclick=async()=>{save.disabled=true;try{await request('/api/teacher/grade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({submission_id:row.id,grade:input.value===''?null:Number(input.value)})});showError('pageError','Оцінку збережено.')}catch(e){showError('pageError',e.message)}finally{save.disabled=false}};gradeBox.append(label,input,save);header.append(details,gradeBox);const codeLabel=document.createElement('h3');codeLabel.textContent='Код';const code=document.createElement('pre');code.className='code';code.textContent=row.code;const outputLabel=document.createElement('h3');outputLabel.textContent='Результат запуску';const output=document.createElement('pre');output.className='output';output.textContent=row.output||'(порожній результат)';card.append(header,codeLabel,code,outputLabel,output);root.append(card)}}
async function loadSubmissions(){showError('pageError','');try{render(await request('/api/teacher/submissions?class_name='+encodeURIComponent($('classSelect').value)))}catch(e){showError('pageError',e.message);if(e.message.includes('вхід'))showLogin()}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();showError('loginError','');try{await request('/api/teacher/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});$('password').value='';showApp()}catch(e){showError('loginError',e.message)}});
$('refresh').onclick=loadSubmissions;$('classSelect').onchange=loadSubmissions;$('logout').onclick=async()=>{await request('/api/teacher/logout',{method:'POST'});showLogin()};checkSession();
</script></body></html>
