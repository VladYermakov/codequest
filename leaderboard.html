<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таблиця лідерів — CodeQuest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--ink:#17221e;--muted:#77817b;--paper:#f5f6f1;--panel:#fff;--line:#e8ebe5;--green:#236b4d;--soft:#eaf4e8;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}.shell{max-width:1000px;margin:auto;padding:0 28px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;letter-spacing:-.6px}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font:17px var(--mono)}.brand em{font-style:normal;color:var(--green)}.back{font-size:13px;font-weight:700;color:var(--green)}main{padding:44px 0 70px}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.eyebrow i{width:7px;height:7px;border-radius:50%;background:#78bb65}h1{font-size:clamp(30px,5vw,42px);letter-spacing:-1.5px;margin:10px 0 7px}.intro{margin:0;color:var(--muted);font-size:14px}.classes{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0 18px}.class-btn{border:1px solid var(--line);border-radius:22px;background:#fff;color:#637068;padding:10px 16px;font:700 12px var(--sans);cursor:pointer}.class-btn.active{background:var(--green);border-color:var(--green);color:#fff}.board{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.board-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.board-head h2{margin:0;font-size:17px}.board-head span{color:var(--muted);font-size:11px}.entries{padding:4px 23px}.entry{display:grid;grid-template-columns:45px 1fr auto;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #eff1ed}.entry:last-child{border-bottom:0}.rank{width:34px;height:34px;border-radius:11px;background:#f2f4f0;display:grid;place-items:center;color:#7d8881;font:12px var(--mono)}.entry:nth-child(1) .rank{background:#fff4d9;color:#a77716}.entry:nth-child(2) .rank{background:#eef1f3;color:#65717c}.entry:nth-child(3) .rank{background:#f8e8dc;color:#9d6949}.name{font-size:14px;font-weight:700}.you{margin-left:7px;color:var(--green);font-size:10px;font-weight:700}.score{font-size:14px;font-weight:800}.score small{color:var(--muted);font-size:11px;font-weight:500}.empty,.status{padding:25px 23px;color:var(--muted);font-size:13px}.foot{text-align:center;padding:20px;color:#98a19b;font-size:10px}@media(max-width:560px){.shell{padding:0 15px}.topbar{height:66px}.brand{font-size:17px}.back{font-size:11px}main{padding-top:32px}.board-head{padding:17px}.entries{padding:4px 17px}.entry{grid-template-columns:38px 1fr auto;gap:9px}.rank{width:32px;height:32px}.name{font-size:13px}}
</style>
</head>
<body><div class="shell"><header class="topbar"><a class="brand" href="/v2"><span class="brandmark">&lt;/&gt;</span><span>code<em>quest</em></span></a><a class="back" id="backLink" href="/v2">← До завдань</a></header><main><div class="eyebrow"><i></i> РЕЗУЛЬТАТИ КЛАСУ</div><h1>Таблиця лідерів</h1><p class="intro">Обери клас, щоб переглянути бали учнів.</p><nav class="classes" aria-label="Оберіть клас"><button class="class-btn" data-class="8В">8В</button><button class="class-btn" data-class="9А">9А</button><button class="class-btn" data-class="9Г">9Г</button><button class="class-btn" data-class="10Д">10Д · SQL</button></nav><section class="board"><header class="board-head"><h2 id="boardTitle">🏆 8В</h2><span id="entryCount"></span></header><div id="entries" class="entries" aria-live="polite"><div class="status">Завантажуємо таблицю…</div></div></section></main><footer class="foot">CodeQuest · Навчайся, розв’язуй, зростай</footer></div>
<script>
const classes=['8В','9А','9Г','10Д'];const params=new URLSearchParams(location.search);let activeClass=classes.includes(params.get('class'))?params.get('class'):'8В';let currentUsername='';const entriesRoot=document.getElementById('entries');const safe=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function updatePage(){const params=new URLSearchParams(location.search);params.set('class',activeClass);history.replaceState(null,'','?'+params.toString());document.querySelectorAll('.class-btn').forEach(button=>button.classList.toggle('active',button.dataset.class===activeClass));document.getElementById('boardTitle').textContent='🏆 '+activeClass+(activeClass==='10Д'?' · SQL':'');document.getElementById('backLink').href=activeClass==='10Д'?'/sql':'/v2?class='+encodeURIComponent(activeClass);loadEntries()}
async function loadEntries(){entriesRoot.innerHTML='<div class="status">Завантажуємо таблицю…</div>';document.getElementById('entryCount').textContent='';try{const endpoint=activeClass==='10Д'?'/api/sql/leaderboard':'/api/leaderboard?class_name='+encodeURIComponent(activeClass);const response=await fetch(endpoint);if(!response.ok)throw new Error('Не вдалося завантажити таблицю. Спробуйте оновити сторінку.');const entries=await response.json();document.getElementById('entryCount').textContent=entries.length+' '+(entries.length===1?'учень':'учнів');if(!entries.length){entriesRoot.innerHTML='<div class="empty">У цьому класі поки немає збережених результатів.</div>';return}let previousScore=null,place=0;entriesRoot.innerHTML=entries.map((entry,index)=>{const score=Number(entry.score||0);if(index===0||score!==previousScore)place=index+1;previousScore=score;return '<article class="entry"><span class="rank">'+String(place).padStart(2,'0')+'</span><span class="name">'+safe(entry.name)+(entry.name===currentUsername?'<span class="you">це ви</span>':'')+'</span><span class="score">'+score+' <small>балів</small></span></article>'}).join('')}catch(error){entriesRoot.innerHTML='<div class="status">'+safe(error.message)+'</div>'}}
document.querySelectorAll('.class-btn').forEach(button=>button.addEventListener('click',()=>{activeClass=button.dataset.class;updatePage()}));fetch('/api/me').then(response=>response.ok?response.json():null).then(user=>{if(user)currentUsername=user.username;loadEntries()}).catch(()=>{});updatePage();
</script></body></html>
